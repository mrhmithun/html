<!DOCTYPE html>
<html>
    <head lang="en">
        <meta charset="UTF-8">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: Arial, sans-serif;
                background: url('https://images.pexels.com/photos/8953377/pexels-photo-8953377.jpeg');
                background-repeat: no-repeat;
                background-size: cover;
                background-position: center;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .weather {
                width: 355px;
                padding: 15px;
                background: rgb(255 255 255 / 10%);
                backdrop-filter: blur(10px) saturate(1.1);
                border-radius: 50px;
                border: 1px solid rgb(255 255 255 / 30%);
                color: white;
            }
            .upper {
                background: rgba(135, 135, 135, 30%);
                border-radius: 30px;
                backdrop-filter: blur(10px) saturate(1.1);
                padding: 15px;
            }
            .weather-current {
                display: flex;
                gap: 25px;
            }
            .mid-text {
                display: inline-flex;
                flex-direction: column;
                gap: 5px;
            }
            .mid-text div:first-child {
                font-size: 13px;
                color: rgba(255, 255, 255, 65%);
            }
            .mid-text div:nth-child(2) {
                font-size: 22px;
                font-weight: 500;
                color: white;
            }
            .mid-text div:last-child {
                font-size: 14px;
                color: rgba(255, 255, 255, 65%);
            }
            .time-bar {
                grid-column: 1 / 3;
                width: 100%;
                height: 48px;
                border-radius: 25px;
                background: rgba(0, 38, 38, 72%);
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
                padding: 0 12px;
                font-size: 12px;
                color: white;
                margin-top: 8px;
            }
            .time-bar > div {
                display: flex;
                align-items: center;
                gap: 5px;
            }
            .time-bar > div:last-child {
                justify-content: flex-end;
            }
            .rain {
                height: 40px;
                margin-top: 12px;
                border-radius: 22px;
                background: rgba(0, 40, 40, 72%);
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 6px;
                font-size: 14px;
                color: rgba(255, 255, 255, 75%);
            }
            .rain span:last-child {
                color: white;
            }
            .humidity {
                height: 45px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 2px;
                font-size: 16px;
                color: rgba(255, 255, 255, 65%);
            }
            .humidity > div > span:last-child {
                color: white;
            }
            .weather-hourly {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                gap: 5px;
                margin-top: 2px;
            }
            .weather-hourly > div {
                height: 128px;
                border-radius: 20px;
                background: rgba(255, 255, 255, 10%);
                border: 1px solid rgba(255, 255, 255, 05%);
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                padding: 10px 2px;
                gap: 9px;
                font-size: 12px;
            }
            .weather-hourly > div > span:first-child {
                font-size: 12px;
                color: rgba(255, 255, 255, 75%);
            }
            .weather-hourly > div > span:nth-child(3) {
                font-size: 14px;
                color: white;
            }
            .weather-hourly > div > span:last-child {
                font-size: 12px;
                color: rgba(255, 255, 255, 55%);
            }
        </style>
    </head>
