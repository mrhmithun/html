<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <style>
            body {
                font-family: Arial, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .container {
                height: 100vh;
                width: 1100px;
                background-color: bisque;
                border-radius: 10px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            h1 {
                color: #c31b1b;
                font-weight: 600;
            }
            button {
                color: white;
                background-color: green;
                padding: 10px 30px;
                border: none;
                border-radius: 7px;
                margin-bottom: 30px;
            }
            .counter {
                padding: 10px 50px;
                background-color: rgb(223, 184, 184);
                border-radius: 7px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Click count</h1>
            <button id="press">
                Click
            </button>
            <div class="counter" id="result">
                0 Click
            </div>
        </div>
        <script>
            var punch = document.getElementById('press');
            var res =document.getElementById('result');
            var count = 0;
            punch.addEventListener('click', function(e) {
                count++;
                res.innerText = count + ' times click'
            });
        </script>
    </body>
</html>
