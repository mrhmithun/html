<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: Arial, sans-serif;
                background: url(https://images.unsplash.com/photo-1620121692029-d088224ddc74?q=80&w=2532&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&fbclid=IwY2xjawT0TCpwZG9mBWV4dG4DYWVtAjEwAGJyaWQRMUE4SWJ2QzllV2ZRRWJSMVlzcnRjBmFwcF9pZBAyMjIwMzkxNzg4MjAwODkyAAEeQYRQyNF-wX6f0HudGZQ3mUYNahFbcXbEl_UmW7ZLD7ea7-iGZGBwyuPB1So_aem_ZmFrZWR1bW15MTZieXRlcw);
                background-repeat: no-repeat;
                background-size: cover;
                background-position: center;
                min-height: 100vh;
            }
            .weather-location {
                font-size: 28px;
                font-weight: 600;
                display: flex;
                justify-content: space-between;
            }
            .cloud {
                font-size: 45px;
                margin-top: -20px;
            }
            .weather-current {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .weather-current h1 {
                font-size: 72px;
                font-weight: 300;
            }
            .weather-summary {
                text-align: right;
                font-size: 26px;
                font-weight: 500;
            }
            .weather-hourly {
                display: grid;
                grid-template-columns: repeat(6, 1fr);
                text-align: center;
            }
            .weather-hourly div {
                display: flex;
                flex-direction: column;
                height: 100px;
                justify-content: space-evenly;
                font-size: 21px;
            }
            .podcast-cover {
                width: 80px;
                height: 80px;
                border-radius: 10px;
                overflow: hidden;
            }
            .podcast-cover img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .podcast-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
            }
            .podcast-icon {
                font-size: 40px;
            }
            .podcast-date,
            .podcast-title,
            .podcast-duration {
                font-size: 20px;
            }
            .play {
                display: inline-flex;
                align-items: center;
                padding: 8px 18px;
                border-radius: 30px;
                background: rgb(255 255 255 / 10%);
            }
            .note-icon {
                font-size: 50px;
            }
            .note-title {
                font-size: 20px;
            }
            .grid {
                margin: 50px auto;
                max-width: 560px;
                display: grid;
                gap: 20px;
                grid-template-columns: repeat(12, 1fr);
            }
            .card {
                background: rgb(255 255 255 / 10%);
                padding: 25px;
                backdrop-filter: blur(10px) saturate(1.1);
                border: 1px solid rgb(255 255 255 / 30%);
                border-radius: 40px;
                color: #fff;
            }
            .weather {
                grid-area: 1 / 1 / 2 / 13;
                padding: 25px;
            }
            .podcast {
                grid-area: 2 / 1 / 3 / 7;
                height: 275px;
                display: flex;
                flex-direction: column;
                justify-content: space-evenly
            }
            .note {
                grid-area: 2 / 7 / 3 / 13;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }
        </style>
    </head>
    <body>
        <div class="grid">
            <div class=" card weather">
                <div class="weather-location">
                    <span>San Francisco</span>
                    <span class="cloud">☁️</span>
                </div>
                <div class="weather-current">
                    <div>
                        <h1>54°</h1>
                    </div>
                    <div class="weather-summary">
                        <div>Partly Cloudy</div>
                        <div>H:57° L:49°</div>
                    </div>
                </div>
                <div class="weather-hourly">
                    <div><span>10 AM</span><span>🌤️</span><strong>54°</strong></div>
                    <div><span>11 AM</span><span>🌤️</span><strong>55°</strong></div>
                    <div><span>12 PM</span><span>☀️</span><strong>56°</strong></div>
                    <div><span>1 PM</span><span>☀️</span><strong>57°</strong></div>
                    <div><span>2 PM</span><span>☀️</span><strong>57°</strong></div>
                    <div><span>3 PM</span><span>☀️</span><strong>56°</strong></div>
                </div>
            </div>
            <div class="card podcast">
                <div class="podcast-header">
                    <div class="podcast-cover"><img src="https://images.pexels.com/photos/10260863/pexels-photo-10260863.jpeg" alt="Album"></div>
                    <div class="podcast-icon">🎙️</div>
                </div>
                <div class="podcast-date">Mar 19</div>
                <div class="podcast-title">What is a Quantum Computer?</div>
                <div class="podcast-duration"> <span class="play">▶39m</span></div>
            </div>
            <div class="card note">
                <div class="note-icon">🙂</div>
                <div class="note-title"> Call Mom </div>
            </div>
        </div>
    </body>
</html>
