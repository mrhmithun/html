<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgb(193, 240, 247);
        flex-direction: column;
      }

      .full-container {
        width: 430px;
        padding: 35px;
        background: #fff;
        border-radius: 18px;
      }

      .heading h1 {
        font-size: 27px;
        margin-bottom: 10px;
        text-align: center;
      }

      #student {
        display: flex;
      }

      #mark {
        display: flex;
      }

      label {
        display: block;
        margin-bottom: 9px;
        font-size: 14px;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #000000;
        border-radius: 9px;
        font-size: 15px;
        margin-bottom: 9px;
      }

      #submit_btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 9px;
        background: rgb(0, 204, 255);
        color: white;
        font-size: 16px;
        font-weight: bold;
        margin-top: 10px;
      }

      #result div,
      #form-error div {
        width: 100%;
        padding: 14px;
        margin-top: 20px;
        border-radius: 9px;
        color: #fff;
        font-size: 16px;
      }

      .green {
        background: green;
      }

      .red {
        background: red;
      }

      .yellow {
        background: yellow;
      }

      .blue {
        background: rgb(20, 155, 218);
      }

      .lime {
        background: rgb(181, 224, 117);
      }

      .orange {
        background: orange;
      }

      #result-table {
        margin-top: 30px;
        min-width: 560px;
        display: none;
      }

      table {
        font-family: Arial, Helvetica, sans-serif;
        border-collapse: collapse;
        width: 100%;
      }

      td,
      th {
        border: 1px solid #ddd;
        padding: 8px;
      }

      tr:nth-child(even) {
        background-color: #f2f2f2
      }

      tr:hover {
        background-color: #ddd;
      }

      th {
        padding-top: 12px;
        padding-bottom: 12px;
        text-align: left;
        background-color: #04AA6D;
        color: white;
      }

      .delete {
        border: 0;
        background: white;
        color: #000;
        padding: 5px 10px;
        cursor: pointer;
      }

      .delete:hover {
        background: red;
        color: white;
        transition: 0.3s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div class="full-container">
      <div class="heading">
        <h1>Student Result</h1>
      </div>
      <form action="/action_page.php">
        <div>
          <label for="student">Student Name</label>
          <input id="student" type="text" name="student_name">
        </div>
        <div>
          <label for="mark">Total Mark</label>
          <input id="mark" type="number" name="total_mark" min="0" max="100">
        </div>
        <div id="form-error"></div>
      </form>
      <button id="submit_btn">Submit</button>
      <div id="result"></div>
    </div>
    <div id="result-table">
      <table>
        <thead>
          <tr>
            <th>Student</th>
            <th>Number</th>
            <th>Grade</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>
    <script>
      let chatro = document.getElementById('student');
      let koto_number = document.getElementById('mark');
      let submit_btn = document.getElementById('submit_btn');
      const pass_mark = 33;
      const d_mark = 39;
      const c_mark = 49;
      const b_mark = 59;
      const a_minus_mark = 69;
      const a_mark = 79;
      const a_plus_mark = 80;
      let list = [];
      var form_error = document.getElementById('form-error');
      mark.addEventListener('keyup', function(e) {
        let mark = koto_number.value;
        if (mark > 100) {
          r_tamplate('Number can\'t exceed 100', 'red', form_error);
          document.getElementById('submit_btn').disabled = true;
        } else {
          document.getElementById('submit_btn').disabled = false;
          form_error.innerHTML = '';
        }
      });
      submit_btn.addEventListener('click', function(e) {
        e.preventDefault();
        let naam = chatro.value;
        let mark = koto_number.value;
        let grade = '';
        let result = document.getElementById('result');
        if (mark > 100) {
          r_tamplate('Number can\'t exceed 100', 'red', form_error);
          return;
        } else if (mark >= a_plus_mark) {
          r_tamplate(naam + ' Grade- A+', 'green', result);
          grade = 'A+';
        } else if (mark >= a_mark) {
          r_tamplate(naam + ' Grade- A', 'lime', result);
          grade = 'A';
        } else if (mark >= a_minus_mark) {
          r_tamplate(naam + ' Grade- A-', 'blue', result);
          grade = 'A-';
        } else if (mark >= b_mark) {
          r_tamplate(naam + ' Grade- B', 'blue', result);
          grade = 'B';
        } else if (mark >= c_mark) {
          r_tamplate(naam + ' Grade- C', 'orange', result);
          grade = 'C';
        } else if (mark >= d_mark) {
          r_tamplate(naam + ' Grade- D', 'lime', result);
          grade = 'D';
        } else if (mark >= pass_mark) {
          r_tamplate(naam + ' konomote pass', 'yellow', result);
          grade = 'E';
        } else {
          r_tamplate(naam + ' Innanillah', 'red', result);
          grade = 'F';
        }
        let res_table = document.getElementById('result-table');
        res_table.style.display = 'block';
        if (!list.some(l => l[0] === naam && l[1] === mark || l[2] === grade)) {
          list.push([naam, mark, grade]);
        }
        document.getElementById('list').innerHTML = '';
        listGen(list);
      });

      function r_tamplate(text, css_class, html_target) {
        let html = `
                
						<div class="${css_class}">${text}</div>
                `;
        html_target.innerHTML = html;
      }

      function l_tamplate(name, mark, grade, index) {
        let html = `
                
						<tr>
							<td>${name}</td>
							<td>${mark}</td>
							<td>${grade}</td>
							<td>
								<button class="delete" data-index="${index}">Delete</button>
							</td>
						</tr>
                `;
        document.getElementById('list').innerHTML += html;
      }
      document.getElementById('list').addEventListener('click', function(e) {
        if (e.target.classList.contains('delete')) {
          let delItem = e.target.dataset.index;
          list.splice(delItem, 1);
          document.getElementById('list').innerHTML = '';
          listGen(list);
        }
      });

      function listGen(list) {
        list.forEach((l, index) => {
          l_tamplate(l[0], l[1], l[2], index);
        });
      }
    </script>
  </body>
</html>
